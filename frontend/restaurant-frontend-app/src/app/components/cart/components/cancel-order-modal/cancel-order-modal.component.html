<div
  class="modal-backdrop modal-backdrop--bottom"
  tabindex="0"
  role="button"
  aria-label="Close cancel-order dialog"
  (click)="closeModal()"
  (keydown.enter)="closeModal()"
  (keydown.space)="closeModal(); $event.preventDefault()"
>
  <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="cancel-order-title" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 id="cancel-order-title">Cancel Order</h2>

      <button type="button" class="icon-button icon-button--small" aria-label="Close dialog" (click)="closeModal()">
        <img src="assets/svg/close.svg" alt="" aria-hidden="true"/>
      </button>
    </div>

    <p class="body">Are you sure you want to cancel pre-order
      #{{ orderId() }}?
    </p>

    <div class="actions">
      <button type="button" class="button button--secondary button--large"
        (click)="closeModal()"
      >
        No
      </button>

      <button type="button" class="button button--primary button--large"
        (click)="cancelOrder()"
      >
        Yes, Cancel
      </button>
    </div>
  </div>
</div>
