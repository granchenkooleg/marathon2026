<form
  class="card password-card"
  [formGroup]="passwordForm"
  (ngSubmit)="onChangePassword()"
>
  <app-password
    [control]="oldPassword"
    label="Old Password"
    placeholder="Enter your old password"
  />

  <app-password-with-rules
    class="password"
    [control]="password"
    label="Password"
    placeholder="Enter your new password"
  />

  <app-confirm-password
    class="password"
    [control]="confirmPassword"
  />

  <button
    type="submit"
    class="button button--primary button--large save-button"
    [disabled]="passwordForm.invalid"
  >
    Save Changes
  </button>
</form>
