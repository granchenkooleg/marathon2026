@if ((label() ?? '').length > 0) {
  <label class="password-label" [for]="inputId" [class.focused]="passwordFocused()">
    {{ label() }}
  </label>
}

<div class="password-wrapper">
  <input
    [id]="inputId"
    [type]="showPassword() ? 'text' : 'password'"
    [formControl]="control()"
    [placeholder]="placeholder()"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  <button type="button" class="toggle-icon" (click)="toggleShowPassword()">
    <img [src]="showPassword() ? 'assets/svg/eye_closed.svg' : 'assets/svg/eye.svg'" alt="eye" />
  </button>
</div>
