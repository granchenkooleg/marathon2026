<a
  [routerLink]="'/locations/' + location().id"
  routerLinkActive="router-link-active"
  class="location-card"
  [style.max-width]="maxWidth() || null"
>
  <img
    [src]="location().imageUrl"
    [alt]="'Restaurant at ' + location().address"
    class="location-image"
  />

  <div class="location-text-block">
    <div class="location-info">
      <img
        src="assets/svg/address.svg"
        alt=""
        aria-hidden="true"
        class="location-icon"
      />
      <span class="location-text">
        {{ location().address }}
      </span>
    </div>

    <div class="tables-info">
      <div class="capacity">
        <img
          src="assets/svg/table.svg"
          alt=""
          aria-hidden="true"
          class="table-icon"
        />
        <span class="value">
          {{ location().totalCapacity }}
        </span>
        <span class="label">
          {{ tablesLabel }}
        </span>
      </div>

      <div class="occupancy">
        <span class="label">Daily occupancy: </span>
        <span class="value">
          {{ location().averageOccupancy }}
        </span>
      </div>
    </div>
  </div>
</a>
