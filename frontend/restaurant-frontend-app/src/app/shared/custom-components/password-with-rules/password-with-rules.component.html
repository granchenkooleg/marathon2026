<div class="label-password">
  <div class="field-check-strenght-password">
    <span class="password-label">
      {{ label() }}
    </span>

    @if (control()?.dirty || control()?.touched) {
      <div class="password-strength">
        <span class="indicator-dot" [ngClass]="passwordStrengthColor()"></span>
        <span>{{ passwordStrength() }}</span>
      </div>
    }
  </div>

  <app-password [control]="control()" [placeholder]="placeholder()"> </app-password>
</div>

<ul class="password-rules">
  <li
    class="requirement-item"
    [ngClass]="{
      valid: passwordValid().hasUppercase,
      invalid: !passwordValid().hasUppercase && (control()?.dirty || control()?.touched)
    }"
  >
    At least one uppercase letter required
  </li>
  <li
    class="requirement-item"
    [ngClass]="{
      valid: passwordValid().hasLowercase,
      invalid: !passwordValid().hasLowercase && (control()?.dirty || control()?.touched)
    }"
  >
    At least one lowercase letter required
  </li>
  <li
    class="requirement-item"
    [ngClass]="{
      valid: passwordValid().hasNumber,
      invalid: !passwordValid().hasNumber && (control()?.dirty || control()?.touched)
    }"
  >
    At least one number required
  </li>
  <li
    class="requirement-item"
    [ngClass]="{
      valid: passwordValid().hasSpecialCharacter,
      invalid: !passwordValid().hasSpecialCharacter && (control()?.dirty || control()?.touched)
    }"
  >
    At least one special character &#64; required
  </li>
  <li
    class="requirement-item"
    [ngClass]="{
      valid: passwordValid().lengthValid,
      invalid: !passwordValid().lengthValid && (control()?.dirty || control()?.touched)
    }"
  >
    Password must be 8–16 characters long
  </li>
</ul>
